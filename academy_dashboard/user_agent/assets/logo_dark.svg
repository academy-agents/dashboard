<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ep {
      fill: none;
      stroke: url(#eyeGradient);
      stroke-width: 5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 10px rgba(0,242,255,0.45));
    }
    .cz {
      fill: none;
      stroke: #00f2ff;
      stroke-width: 5;
      opacity: 0.75;
      filter: drop-shadow(0 0 4px rgba(0,242,255,0.6));
    }
    .zg {
      fill: none;
      stroke: #00ffaa;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.10;
    }
    .zt {
      fill: none;
      stroke: #ffffff;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 14px #00f2ff);
      stroke-dasharray: 85 240;
      stroke-dashoffset: 325;
      animation: traceZ 2.5s linear infinite;
    }
    @keyframes traceZ {
      0%   { stroke-dashoffset: 325; opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { stroke-dashoffset: -240; opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00ffaa" />
      <stop offset="50%"  stop-color="#00f2ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
  </defs>
  <rect width="200" height="300" fill="#020508" />
  <path d="M 100 20 C 172 80, 172 220, 100 280" class="ep" />
  <path d="M 100 20 C 28 80, 28 220, 100 280"  class="ep" />
  <circle cx="100" cy="150" r="48" class="cz" />
  <path d="M 67 117 L 133 117 L 67 183 L 133 183" class="zg" />
  <path d="M 67 117 L 133 117 L 67 183 L 133 183" class="zt" />
</svg>
